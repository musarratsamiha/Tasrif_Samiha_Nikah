<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7e7d7"><meta name="description" content="Tasrif & Samiha invite you to their Nikah on January 1, 2027 after Maghrib.">
<title>Tasrif & Samiha | Nikah Invitation</title>
<link rel="preload" as="image" href="envelope.webp"><link rel="stylesheet" href="style.css?v=approved-1"><script src="script.js?v=approved-1" defer></script></head>
<body><main class="invitation" id="invitation" aria-label="Tasrif and Samiha's Nikah invitation">
<section class="scene scene-envelope active" data-scene="0" aria-label="Open the invitation"><div class="artwork" style="--image:url('envelope.webp')"></div>
<div class="envelope-flap" aria-hidden="true"></div><div class="envelope-letter" aria-hidden="true"><small>With the blessings of Allah</small><strong>Our Nikah</strong><span>01 · 01 · 2027</span></div><button type="button" class="pill open-button" id="openButton">Tap to Open ✧</button></section>
<section class="scene scene-verse" data-scene="1" aria-label="Qur'anic blessing" aria-hidden="true"><div class="artwork" style="--image:url('verse-approved.png')"></div></section>
<section class="scene scene-ceremony" data-scene="2" aria-label="Nikah ceremony" aria-hidden="true"><div class="artwork" style="--image:url('ceremony-approved.png')"></div><div class="petals" id="petals" aria-hidden="true"></div></section>
<section class="scene scene-countdown" data-scene="3" aria-label="Countdown to our Nikah" aria-hidden="true"><div class="artwork" style="--image:url('countdown-approved.png')"></div>
<div class="glow glow-a"></div><div class="glow glow-b"></div><div class="glow glow-c"></div><div class="glow glow-d"></div><div class="glow glow-e"></div><div class="glow glow-f"></div>
<div class="count-live" role="timer" aria-label="Live countdown to January 1 2027">
<div class="number-card"><span class="card-label">DAYS</span><span class="ornament">— ❖ —</span><strong id="days">--</strong></div>
<div class="number-card"><span class="card-label">HOURS</span><span class="ornament">— ❖ —</span><strong id="hours">--</strong></div>
<div class="number-card"><span class="card-label">MINUTES</span><span class="ornament">— ❖ —</span><strong id="minutes">--</strong></div>
</div></section>
<section class="scene scene-note" data-scene="4" aria-label="A note from us" aria-hidden="true"><div class="artwork" style="--image:url('note-approved.png')"></div><button class="replay-hit" id="againButton" type="button" aria-label="Experience the invitation again"></button></section>
<nav class="controls" id="controls" hidden aria-label="Invitation navigation"><button type="button" id="prevButton" aria-label="Previous slide">‹</button><div id="dots" class="dots" aria-hidden="true"></div><button type="button" id="nextButton" aria-label="Next slide">›</button></nav>
</main></body></html>
